services:
  - type: web_service
    name: centro-familiar-backend
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --dir apps/backend build && pnpm --dir apps/backend exec prisma migrate deploy
    startCommand: pnpm --dir apps/backend run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://proyecto-familia-five.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
